<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 1000 830" width="1000" height="830">
  <defs>
    <linearGradient id="redBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5A33"/>
      <stop offset="0.55" stop-color="#EE3016"/>
      <stop offset="1" stop-color="#B8120A"/>
    </linearGradient>
    <linearGradient id="redBody2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF5A33"/>
      <stop offset="0.55" stop-color="#EE3016"/>
      <stop offset="1" stop-color="#B8120A"/>
    </linearGradient>
    <linearGradient id="blueFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AD6FF"/>
      <stop offset="0.5" stop-color="#14A9FA"/>
      <stop offset="1" stop-color="#0A7BE8"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#E4E8EE"/>
      <stop offset="0.55" stop-color="#A9B1BD"/>
      <stop offset="1" stop-color="#EEF1F5"/>
    </linearGradient>
    <filter id="glowRed" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="b"/>
      <feFlood flood-color="#FF2A10" flood-opacity="0.85"/>
      <feComposite in2="b" operator="in"/>
    </filter>
    <filter id="glowBlue" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="b"/>
      <feFlood flood-color="#1E7BFF" flood-opacity="0.9"/>
      <feComposite in2="b" operator="in"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="spark" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="shadow" x="-10%" y="-40%" width="120%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <polygon id="arrowTop" points="120,325 618,120 546,212 880,325"/>
    <polygon id="arrowBot" points="880,640 382,845 454,753 120,640"/>
    <polygon id="arrowTopIn" points="190,307 566,152 500,226 820,307"/>
    <polygon id="arrowBotIn" points="810,658 434,813 500,739 180,658"/>
  </defs>

  <!-- SETAS -->
  <g id="setas">
    <g filter="url(#glowRed)">
      <use href="#arrowTop" fill="#000" stroke="#000" stroke-width="30" stroke-linejoin="round"/>
      <use href="#arrowBot" fill="#000" stroke="#000" stroke-width="30" stroke-linejoin="round"/>
    </g>
    <use href="#arrowTop" fill="url(#redBody)" stroke="#FF3A1E" stroke-width="30" stroke-linejoin="round"/>
    <use href="#arrowBot" fill="url(#redBody2)" stroke="#FF3A1E" stroke-width="30" stroke-linejoin="round"/>
    <use href="#arrowTop" fill="none" stroke="#FF8E6E" stroke-width="5" stroke-linejoin="round" opacity="0.85"/>
    <use href="#arrowBot" fill="none" stroke="#FF8E6E" stroke-width="5" stroke-linejoin="round" opacity="0.85"/>
    <use href="#arrowTopIn" fill="none" stroke="#FF9A80" stroke-width="3" stroke-linejoin="round" opacity="0.55"/>
    <use href="#arrowBotIn" fill="none" stroke="#FF9A80" stroke-width="3" stroke-linejoin="round" opacity="0.55"/>
    <!-- brilhos -->
    <g filter="url(#spark)" fill="#CFE6FF">
      <ellipse cx="560" cy="262" rx="60" ry="3" opacity="0.45" transform="rotate(-6 560 262)"/>
      <ellipse cx="430" cy="702" rx="60" ry="3" opacity="0.45" transform="rotate(-6 430 702)"/>
      <circle cx="520" cy="300" r="6" fill="#6FA8FF"/>
      <circle cx="480" cy="665" r="6" fill="#6FA8FF"/>
    </g>
      </g>

